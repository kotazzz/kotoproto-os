<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kotoproto-os — атлас эмоций</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="atlas-page">
  <main class="atlas">
    <section class="panel atlas-stage">
      <div class="panel-head">
        <h2>Визор</h2>
        <a class="atlas-link" href="/">Симулятор</a>
      </div>
      <div class="visor-wrap">
        <div class="visor-panel">
          <canvas id="left" width="768" height="384"></canvas>
        </div>
        <div class="visor-panel">
          <canvas id="right" width="768" height="384"></canvas>
        </div>
      </div>
    </section>
    <section class="panel atlas-gallery">
      <div class="panel-head">
        <h2>Эмоции</h2>
        <p class="atlas-meta" id="meta">загрузка…</p>
      </div>
      <div class="atlas-controls">
        <button id="boop" type="button">boop</button>
        <button id="blink" type="button">blink</button>
        <button id="replay" type="button">переход</button>
        <button id="mouth" type="button">рот</button>
      </div>
      <div class="atlas-list" id="lists"></div>
    </section>
  </main>
  <script src="/atlas.js"></script>
</body>
</html>
